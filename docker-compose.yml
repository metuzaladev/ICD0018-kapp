services:
  db:
    # imresamu/postgis is the multi-arch build of the official postgis/postgis image
    # (the official one has no arm64 / Apple Silicon variant).
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: kapp
      POSTGRES_PASSWORD: kapp
      POSTGRES_DB: kapp
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kapp -d kapp']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  # S3-compatible object storage for dog photos (production: Cloudflare R2), see docs/10.
  # MinIO no longer publishes images on Docker Hub; Chainguard builds it from source (multi-arch).
  minio:
    image: chainguard/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: kapp
      MINIO_ROOT_PASSWORD: kapp-dev-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data

  # One-shot: creates the private photo bucket (idempotent). Run explicitly after `up`
  # (`npm run db:up` does: docker compose run --rm minio-setup) — in a profile because some
  # Compose versions treat a finished one-shot as a failed service under `up --wait`.
  # The image has no shell, so the server address and credentials come from MC_HOST_<alias>.
  minio-setup:
    image: chainguard/minio-client:latest
    profiles: [setup]
    depends_on: [minio]
    environment:
      MC_HOST_local: http://kapp:kapp-dev-secret@minio:9000
    command: ['mb', '--ignore-existing', 'local/kapp-photos']

volumes:
  db-data:
  minio-data:
