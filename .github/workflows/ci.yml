name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: kapp
          POSTGRES_PASSWORD: kapp
          POSTGRES_DB: kapp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kapp -d kapp"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # BullMQ push queue (M5); integration tests use their own key prefix and remove it.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://kapp:kapp@localhost:5432/kapp
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -w mobile
      # Translation tables (keys, {{params}}, plural forms) and no hard-coded UI text (docs/11).
      - run: npm run i18n:check
      # Touchables have a role and label, inputs a label, images a label or are hidden (docs/14).
      - run: npm run a11y:check
      - run: npm test
      # MinIO (+ bucket) from docker-compose.yml, so CI and development use the same setup. Not a job
      # service: service containers cannot pass the `server /data` command MinIO needs.
      - run: docker compose up -d --wait minio && docker compose run --rm minio-setup
      - run: npm run db:migrate
      - run: npm run test:integration -w @kapp/api
