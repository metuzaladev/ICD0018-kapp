services:
  db:
    # imresamu/postgis is the multi-arch build of the official postgis/postgis image
    # (the official one has no arm64 / Apple Silicon variant).
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: kapp
      POSTGRES_PASSWORD: kapp
      POSTGRES_DB: kapp
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kapp -d kapp']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  db-data:
