name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: kapp
          POSTGRES_PASSWORD: kapp
          POSTGRES_DB: kapp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kapp -d kapp"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # BullMQ push queue (M5); integration tests use their own key prefix and remove it.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://kapp:kapp@localhost:5432/kapp
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -w mobile
      # Translation tables (keys, {{params}}, plural forms) and no hard-coded UI text (docs/11).
      - run: npm run i18n:check
      # Touchables have a role and label, inputs a label, images a label or are hidden (docs/14).
      - run: npm run a11y:check
      - run: npm test
      # MinIO (+ bucket) from docker-compose.yml, so CI and development use the same setup. Not a job
      # service: service containers cannot pass the `server /data` command MinIO needs.
      - run: docker compose up -d --wait minio && docker compose run --rm minio-setup
      - run: npm run db:migrate
      - run: npm run test:integration -w @kapp/api

  # M8: the production API image must build, migrate a fresh database and pass /health — this also
  # catches a runtime dependency pruned by mistake (apps/api/scripts/prune-runtime-deps.mjs).
  # Nothing is pushed; publishing is the manual release-api.yml workflow.
  docker:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: kapp
          POSTGRES_PASSWORD: kapp
          POSTGRES_DB: kapp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kapp -d kapp"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: kapp-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migrate, start in production mode, check /health and graceful stop
        run: |
          cat > ci.env <<'ENV'
          NODE_ENV=production
          DATABASE_URL=postgres://kapp:kapp@localhost:5432/kapp
          REDIS_URL=redis://localhost:6379
          API_PUBLIC_URL=https://api.ci.invalid
          BETTER_AUTH_SECRET=ci-only-secret-ci-only-secret-ci-only-secret
          S3_ENDPOINT=https://s3.ci.invalid
          S3_ACCESS_KEY_ID=ci
          S3_SECRET_ACCESS_KEY=ci-secret
          RATE_LIMIT_STORE=redis
          REALTIME_ADAPTER=redis
          MAIL_PROVIDER=resend
          RESEND_API_KEY=re_ci_not_a_real_key
          MAIL_FROM=Käpp <noreply@ci.invalid>
          ENV
          docker run --rm --network host --env-file ci.env kapp-api:ci node dist/migrate.js
          docker run -d --name api --network host --env-file ci.env kapp-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/health && break; sleep 1; done
          curl -fsS http://localhost:3000/health | grep -q '"database":"up"'
          docker stop api
          docker logs api | tail -5
          test "$(docker inspect -f '{{.State.ExitCode}}' api)" = 0
